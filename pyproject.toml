[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vt-segmentation-eval"
version = "0.1.0"
description = "Experimental modality-aware cardiac segmentation evaluation pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Research use; see LICENSE"}
authors = [{name = "VT segmentation evaluation contributors"}]
dependencies = [
  "nibabel>=5.2",
  "numpy>=1.26",
  "pydicom>=3.0",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
ct = ["TotalSegmentator==2.18.0"]

[project.scripts]
vtseg = "vtseg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vtseg"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires external software, model weights, or real imaging data",
  "real_case: reads local patient data and is never run by default",
]
