[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cbl-cardiac-segmentation"
version = "0.1.0"
description = "Experimental modality-aware cardiac segmentation evaluation pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Daniel Dorado"}]
dependencies = [
  "nibabel>=5.2",
  "numpy>=1.26",
  "pydicom>=3.0",
  "pylibjpeg>=2.0",
  "pylibjpeg-libjpeg>=2.1",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
ct = ["TotalSegmentator==2.18.0"]
registration = ["SimpleITK>=2.5", "pyvista>=0.44"]
matlab-export = ["scipy>=1.10"]

[project.scripts]
vtseg = "vtseg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vtseg"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires external software, model weights, or real imaging data",
  "real_case: reads local patient data and is never run by default",
]
